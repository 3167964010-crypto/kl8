# 开奖时段高频检查并生成快乐8数据快照，提交后由 GitHub Pages 静态展示
name: 更新快乐8数据快照

on:
  # 自动定时更新已停止（2026-11-22 按用户要求关闭）。
  # 如需恢复自动更新，把下面三行 schedule 取消注释即可。
  # schedule:
  #   - cron: '*/10 12-15 * * *'
  #   - cron: '20 0 * * *'
  #   - cron: '0 4 * * *'
  workflow_dispatch:      # 仅保留手动触发，不再自动运行
    inputs:
      force_ai:
        description: '强制重新生成 AI 自学习号码（跳过同期限流）'
        type: boolean
        default: false

# 同一时间只允许一个快照任务在跑；新触发会取消还在等待旧期的任务，
# 保证"等得最久的那一轮"总是覆盖当前时段，不会越堆越多
concurrency:
  group: kl8-snapshot
  cancel-in-progress: true

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 150      # 晚上会原地等待新一期（最长 100 分钟），超时自动结束避免卡死
    permissions:
      contents: write       # 允许把生成结果提交回仓库
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 大模型参数从仓库 Secrets 读取（Settings → Secrets and variables → Actions）
      # 未配置时 sync_server 自动回退为本地统计模型，不影响快照生成
      - name: 生成数据快照
        env:
          KL8_LLM_URL: ${{ secrets.KL8_LLM_URL }}
          KL8_LLM_KEY: ${{ secrets.KL8_LLM_KEY }}
          KL8_LLM_MODEL: ${{ secrets.KL8_LLM_MODEL }}
          # 还没有新一期时最多原地等待 10 分钟（每 30 秒重抓），抓到就立刻生成并提交
          KL8_WAIT_MIN: '10'
        run: python build_snapshot.py

      # AI 自学习：把最近 50 期开奖 + 各算法命中率交给大模型，生成下一期 10 个号
      # 需在 Secrets 配好 KL8_LLM_*，否则脚本只打印“跳过”，不影响任务
      - name: 生成 AI 自学习号码
        env:
          KL8_LLM_URL: ${{ secrets.KL8_LLM_URL }}
          KL8_LLM_KEY: ${{ secrets.KL8_LLM_KEY }}
          KL8_LLM_MODEL: ${{ secrets.KL8_LLM_MODEL }}
          # 手动触发时勾选 force_ai 才会绕过“同一期只生成一次”的限流
          KL8_AI_FORCE: ${{ inputs.force_ai && '1' || '' }}
        run: python build_ai_learn.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json algos_snapshot.json kl8_snapshot.json predictions.json algo_predictions.json history_backtest.json ai_learn.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新快乐8数据快照 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
