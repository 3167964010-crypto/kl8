# 开奖时段高频检查并生成快乐8数据快照，提交后由 GitHub Pages 静态展示
name: 更新快乐8数据快照

on:
  schedule:
    # 开奖后 30 分钟内必须出现在线上：北京 21:00-22:55 每 5 分钟触发一次（UTC 13:00-14:55）
    # 脚本自身还会在窗口内轮询等待新一期，所以只要有一轮触发成功，就能在抓到时立刻提交
    - cron: '*/5 13-14 * * *'
    # 北京 23:00-23:50 每 10 分钟兜底（UTC 15:00-15:50）
    - cron: '*/10 15 * * *'
    # 次日早上补一次（00:20 UTC = 08:20 北京）：官方若当天很晚才公布，靠这次补上
    - cron: '20 0 * * *'
    # 中午再补一次（04:00 UTC = 12:00 北京）：防止海外网络整晚抽风导致一整天没数据
    - cron: '0 4 * * *'
  workflow_dispatch:      # 支持手动触发
    inputs:
      force_ai:
        description: '强制重新生成 AI 自学习号码（跳过同期限流）'
        type: boolean
        default: false

# 同一时间只允许一个快照任务在跑，避免多轮触发互相抢 git 提交
concurrency:
  group: kl8-snapshot
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 30       # 含等待新一期的轮询时间，超时自动结束避免卡死
    permissions:
      contents: write       # 允许把生成结果提交回仓库
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 大模型参数从仓库 Secrets 读取（Settings → Secrets and variables → Actions）
      # 未配置时 sync_server 自动回退为本地统计模型，不影响快照生成
      - name: 生成数据快照
        env:
          KL8_LLM_URL: ${{ secrets.KL8_LLM_URL }}
          KL8_LLM_KEY: ${{ secrets.KL8_LLM_KEY }}
          KL8_LLM_MODEL: ${{ secrets.KL8_LLM_MODEL }}
          # 还没有新一期时最多原地等待 10 分钟（每 30 秒重抓），抓到就立刻生成并提交
          KL8_WAIT_MIN: '10'
        run: python build_snapshot.py

      # AI 自学习：把最近 50 期开奖 + 各算法命中率交给大模型，生成下一期 10 个号
      # 需在 Secrets 配好 KL8_LLM_*，否则脚本只打印“跳过”，不影响任务
      - name: 生成 AI 自学习号码
        env:
          KL8_LLM_URL: ${{ secrets.KL8_LLM_URL }}
          KL8_LLM_KEY: ${{ secrets.KL8_LLM_KEY }}
          KL8_LLM_MODEL: ${{ secrets.KL8_LLM_MODEL }}
          # 手动触发时勾选 force_ai 才会绕过“同一期只生成一次”的限流
          KL8_AI_FORCE: ${{ inputs.force_ai && '1' || '' }}
        run: python build_ai_learn.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json algos_snapshot.json kl8_snapshot.json predictions.json algo_predictions.json history_backtest.json ai_learn.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新快乐8数据快照 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
