# 开奖时段高频检查并生成快乐8数据快照，提交后由 GitHub Pages 静态展示
name: 更新快乐8数据快照

on:
  schedule:
    # 开奖日（每天 21:30 北京）之后的窗口内每 10 分钟检查一次：
    # GitHub 用 UTC，13:00-15:50 UTC = 北京时间 21:00-23:50，避免"只跑两次"错过官方数据更新
    - cron: '*/10 13-15 * * *'
    # 次日早上补一次（00:20 UTC = 08:20 北京）：官方若当天很晚才公布，靠这次补上
    - cron: '20 0 * * *'
  workflow_dispatch: {}   # 支持手动触发

jobs:
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      contents: write       # 允许把生成结果提交回仓库
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 大模型参数从仓库 Secrets 读取（Settings → Secrets and variables → Actions）
      # 未配置时 sync_server 自动回退为本地统计模型，不影响快照生成
      - name: 生成数据快照
        env:
          KL8_LLM_URL: ${{ secrets.KL8_LLM_URL }}
          KL8_LLM_KEY: ${{ secrets.KL8_LLM_KEY }}
          KL8_LLM_MODEL: ${{ secrets.KL8_LLM_MODEL }}
        run: python build_snapshot.py

      - name: 提交更新
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json algos_snapshot.json kl8_snapshot.json predictions.json algo_predictions.json history_backtest.json
          if git diff --cached --quiet; then
            echo "数据无变化，跳过提交"
          else
            git commit -m "chore: 更新快乐8数据快照 $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
